<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="完全在瀏覽器內完成的私有圖片壓縮工具。圖片不上傳、不離開你的電腦。"
    />
    <title>LocalShrink｜私有本機圖片壓縮</title>
    <style>:root {
  --ink: #171714;
  --paper: #f1efe8;
  --card: #faf9f5;
  --muted: #74736c;
  --line: #d5d2c7;
  --acid: #c8ff43;
  --acid-dark: #a9df24;
  --danger: #b84937;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(23, 23, 20, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23, 23, 20, 0.035) 1px, transparent 1px),
    var(--paper);
  background-size: 32px 32px;
  font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 16px;
}
button, input, select { font: inherit; }
button { color: inherit; }

.topbar {
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 28px;
  border-bottom: 1px solid rgba(23, 23, 20, 0.18);
}
.brand { display: flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: -0.03em; font-size: 20px; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--ink); color: var(--acid); font-size: 12px; letter-spacing: -0.06em; border-radius: 4px; transform: rotate(-3deg); }
.privacy-pill { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(250,249,245,.66); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #63bb2d; box-shadow: 0 0 0 4px rgba(99,187,45,.13); }

.hero { max-width: 1240px; margin: 0 auto; padding: 72px 28px 54px; position: relative; }
.eyebrow, .section-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
.eyebrow { display: inline-block; padding: 7px 9px; background: var(--acid); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); margin-bottom: 26px; }
.hero h1 { margin: 0; max-width: 820px; font-size: clamp(64px, 8vw, 118px); line-height: .98; letter-spacing: -.065em; font-weight: 900; }
.hero h1 span { display: block; margin-top: .12em; color: #77756d; }
.hero-copy { max-width: 510px; margin: 34px 0 0 auto; font-size: 18px; line-height: 1.75; color: #4f4e48; }
.trust-row { max-width: 510px; margin: 18px 0 0 auto; display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; font-weight: 700; }

.workspace { max-width: 1240px; margin: 0 auto 80px; padding: 0 28px; display: grid; grid-template-columns: minmax(0, 1fr) 350px; align-items: start; gap: 20px; }
.workspace-main, .settings { min-width: 0; }
.dropzone { min-height: 250px; border: 1.5px dashed #9b988d; background: rgba(250,249,245,.76); padding: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: .2s ease; position: relative; overflow: hidden; }
.dropzone::before { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(23,23,20,.06); pointer-events: none; }
.dropzone:hover, .dropzone.is-dragging { background: var(--acid); border-color: var(--ink); transform: translateY(-2px); box-shadow: 6px 6px 0 var(--ink); }
.drop-icon { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 28px; line-height: 1; margin-bottom: 18px; background: var(--card); }
.dropzone strong { display: block; font-size: 24px; letter-spacing: -.03em; }
.dropzone span { display: block; font-size: 14px; color: var(--muted); margin-top: 8px; }
.choose-button { margin-top: 24px; border: 1px solid var(--ink); background: var(--ink); color: white; padding: 12px 18px; font-size: 14px; font-weight: 800; cursor: pointer; }
.dropzone:hover .choose-button, .dropzone.is-dragging .choose-button { background: var(--card); color: var(--ink); }
.notice { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 12px; padding: 14px 16px; background: #fff1d5; border: 1px solid #ddc898; font-size: 14px; line-height: 1.5; }
.notice button { background: transparent; border: 0; cursor: pointer; font-size: 18px; }

.queue, .comparison { margin-top: 20px; border: 1px solid var(--line); background: var(--card); }
.queue-head { min-height: 78px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
.queue-head h2, .settings-title h2 { margin: 6px 0 0; font-size: 22px; letter-spacing: -.035em; }
.section-label { color: var(--muted); }
.text-button { border: 0; background: transparent; padding: 7px; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.text-button:disabled { opacity: .5; }
.queue-list { padding: 8px; }
.queue-item { width: 100%; display: grid; grid-template-columns: 40px 52px minmax(180px, 1fr) 96px 86px 28px; align-items: center; gap: 12px; min-height: 108px; border: 1px solid transparent; border-bottom-color: #ebe8df; background: transparent; text-align: left; cursor: pointer; padding: 12px 8px; }
.queue-item:last-child { border-bottom-color: transparent; }
.queue-item:hover, .queue-item.active { background: white; border-color: var(--line); }
.queue-index { font-family: ui-monospace, monospace; font-size: 12px; color: #9a988f; }
.queue-item img { width: 52px; height: 52px; object-fit: cover; background: #e3e0d6; border: 1px solid var(--line); }
.file-copy { min-width: 0; }
.file-copy strong, .file-copy small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.file-copy strong { font-size: 14px; }
.file-copy small { font-size: 12px; color: var(--muted); margin-top: 6px; }
.rename-field { display: grid; grid-template-columns: auto minmax(80px, 1fr); align-items: center; gap: 8px; margin-top: 8px; cursor: text; }
.rename-field > span { color: var(--muted); font-size: 11px; font-weight: 800; white-space: nowrap; }
.rename-field input { width: 100%; min-width: 0; height: 32px; border: 1px solid var(--line); background: #f5f3ed; padding: 5px 8px; color: var(--ink); font-size: 12px; outline: none; }
.rename-field input:focus { border-color: var(--ink); background: white; box-shadow: 0 0 0 2px var(--acid); }
.rename-field input::placeholder { color: #aaa79e; }
.item-state { justify-self: start; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 6px 8px; background: #ebe9e1; }
.item-state.done { background: var(--acid); }
.item-state.working { background: #dfe9ff; animation: pulse 1s infinite alternate; }
.item-state.error { background: #ffe0d8; color: var(--danger); }
.item-size { font-family: ui-monospace, monospace; font-size: 12px; text-align: right; }
.remove { display: grid; place-items: center; width: 24px; height: 24px; border: 0; background: transparent; border-radius: 50%; color: #8a8880; font-size: 17px; cursor: pointer; }
.remove:hover { background: #eeeae1; color: var(--ink); }

.settings { position: sticky; top: 18px; border: 1px solid var(--ink); background: var(--card); box-shadow: 7px 7px 0 rgba(23,23,20,.92); }
.settings-title { padding: 22px; border-bottom: 1px solid var(--line); }
fieldset { border: 0; margin: 0; padding: 22px; border-bottom: 1px solid var(--line); }
legend { padding: 0; font-size: 13px; font-weight: 800; margin-bottom: 14px; }
.format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.format-grid label { padding: 14px; border: 1px solid var(--line); cursor: pointer; background: white; min-height: 76px; }
.format-grid label.selected { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--acid); }
.format-grid input { position: absolute; opacity: 0; pointer-events: none; }
.format-grid strong, .format-grid small { display: block; }
.format-grid strong { font-size: 14px; }
.format-grid small { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.legend-row { display: flex; align-items: center; justify-content: space-between; }
.legend-row legend { margin: 0; }
.legend-row output { background: var(--ink); color: var(--acid); min-width: 44px; padding: 6px 9px; font-family: ui-monospace, monospace; font-size: 12px; text-align: center; }
.range { width: 100%; margin: 18px 0 4px; accent-color: var(--ink); }
.range-notes { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
select { width: 100%; padding: 12px 13px; border: 1px solid var(--line); background: white; color: var(--ink); font-size: 13px; outline: none; }
select:focus { border-color: var(--ink); }
.settings-note { display: flex; gap: 11px; margin: 16px 22px 0; padding: 14px; background: #eeece5; }
.settings-note > span { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: white; font-family: serif; font-size: 12px; }
.settings-note p { margin: 0; color: #66645d; font-size: 11px; line-height: 1.7; }
.summary { margin: 18px 22px 0; padding: 14px 0; border-top: 1px solid var(--line); }
.summary div { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin: 7px 0; }
.summary span { color: var(--muted); }
.summary .saved { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.summary .saved strong { color: #4c910f; font-size: 22px; }
.primary-button { width: calc(100% - 44px); margin: 22px; border: 1px solid var(--ink); background: var(--acid); min-height: 58px; font-size: 14px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: .15s ease; }
.primary-button:hover:not(:disabled) { background: var(--acid-dark); transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
.primary-button:disabled { background: #e3e1da; color: #9a988f; border-color: #aaa79f; box-shadow: none; cursor: not-allowed; justify-content: center; }
.download-actions { margin: -8px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.download-actions button { min-height: 46px; border: 1px solid var(--ink); padding: 0 14px; font-size: 12px; font-weight: 850; cursor: pointer; }
.batch-download { display: flex; align-items: center; justify-content: space-between; background: var(--ink); color: white; }
.batch-download:hover { background: #30302a; }
.zip-download { background: transparent; }
.zip-download:hover { background: #eeece5; }
.spinner { width: 14px; height: 14px; border: 2px solid #aaa79f; border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }

.comparison .download-one { background: var(--ink); color: white; text-decoration: none; padding: 9px 12px; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.compare-grid figure { margin: 0; background: #e8e5db; min-width: 0; }
.compare-grid img { display: block; width: 100%; height: 280px; object-fit: contain; background-image: linear-gradient(45deg,#dad7ce 25%,transparent 25%),linear-gradient(-45deg,#dad7ce 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dad7ce 75%),linear-gradient(-45deg,transparent 75%,#dad7ce 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
.compare-grid figcaption { display: flex; justify-content: space-between; padding: 13px 14px; background: var(--card); font-size: 12px; }
.compare-grid figcaption span { color: var(--muted); }

footer { max-width: 1184px; margin: 0 auto; padding: 30px 0 50px; border-top: 1px solid rgba(23,23,20,.2); display: flex; justify-content: space-between; gap: 30px; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.6; color: var(--muted); }
footer p { margin: 0; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

@media (max-width: 900px) {
  .hero { padding-top: 56px; }
  .hero-copy, .trust-row { margin-left: 0; }
  .workspace { grid-template-columns: 1fr; }
  .workspace-main { grid-row: 1; }
  .settings { position: static; grid-row: 2; box-shadow: 5px 5px 0 var(--ink); }
  footer { margin: 0 28px; }
}

@media (max-width: 600px) {
  .topbar { height: 66px; padding: 0 18px; }
  .privacy-pill { font-size: 11px; padding: 8px 10px; }
  .hero { padding: 46px 18px 38px; }
  .hero h1 { font-size: clamp(52px, 18vw, 78px); line-height: 1.02; letter-spacing: -.05em; }
  .hero-copy { margin-top: 26px; font-size: 16px; }
  .trust-row { gap: 12px; font-size: 12px; }
  .workspace { padding: 0 18px; }
  .dropzone { min-height: 210px; padding: 24px 16px; }
  .queue-item { grid-template-columns: 28px 42px 1fr 56px 22px; gap: 8px; }
  .queue-item img { width: 42px; height: 42px; }
  .item-state { display: none; }
  .item-size { font-size: 11px; }
  .compare-grid { grid-template-columns: 1fr; }
  .compare-grid img { height: 220px; }
  footer { margin: 0 18px; flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

    <style>
      .topbar { position: relative; }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .language-toggle {
        position: static;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 92px;
        padding: 11px 14px;
        border: 1px solid var(--ink);
        background: var(--card);
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .language-toggle:hover {
        background: var(--acid);
      }
      .language-icon {
        width: 17px;
        height: 17px;
        flex: 0 0 17px;
      }
      body { font-size: 18px; }
      .topbar {
        max-width: 1320px;
        height: 92px;
        padding: 0 36px;
      }
      .brand { gap: 13px; font-size: 24px; }
      .brand-mark { width: 42px; height: 42px; font-size: 14px; }
      .privacy-pill { padding: 12px 17px; font-size: 15px; }
      .hero { max-width: 1320px; padding: 88px 36px 68px; }
      .eyebrow, .section-label { font-size: 12px; }
      .hero h1 { font-size: clamp(72px, 8vw, 118px); }
      .hero-copy { max-width: 610px; font-size: 20px; line-height: 1.8; }
      .trust-row { max-width: 610px; gap: 24px; font-size: 15px; }
      .workspace {
        max-width: 1320px;
        grid-template-columns: minmax(0, 1fr) 390px;
        gap: 28px;
        padding: 0 36px;

    <script>
      (() => {

          ["本機模式 · 0 次上傳", "Local mode · 0 uploads"],
          ["離線可用", "Works offline"],
          ["不覆蓋原檔", "Originals stay safe"],
          ["無使用上限", "No usage limits"],

          ["放開就好", "Release to drop"],
          ["或點一下選擇 PNG、JPEG、WebP", "Or click to choose PNG, JPEG, or WebP"],
          ["選擇圖片", "Choose images"],
          ["目前支援 PNG、JPEG 與 WebP；其他檔案已略過。", "PNG, JPEG, and WebP are supported; other files were skipped."],
          ["清空全部", "Clear all"],
          ["尚未選擇圖片", "No images selected"],
          ["張等待處理", " image(s) waiting"],
          ["張處理完成", " image(s) processed"],
          ["正在本機處理 ", "Processing "],
          ["張", " image(s) locally"],
          ["等待", "Waiting"],
          ["處理中…", "Processing…"],
          ["原檔已最小", "Original is already smaller"],
          ["失敗", "Failed"],
          ["輸出檔名", "Output filename"],
          ["移除 ", "Remove "],
          ["壓縮前後", "Before and after"],
          ["下載這張 ↓", "Download this ↓"],
          ["原始", "Original"],
          ["壓縮後 · ", "Compressed · "],
          ["壓縮設定", "Compression settings"],
          ["輸出格式", "Output format"],
          ["智慧選擇", "Smart choice"],
          ["自動挑最小格式", "Automatically choose the smallest format"],
          ["網站通用", "Great for the web"],
          ["適合照片", "Best for photos"],
          ["保留透明", "Keeps transparency"],
          ["圖片品質", "Image quality"],
          ["檔案更小", "Smaller file"],
          ["細節更多", "More detail"],
          ["長邊上限", "Max dimension"],
          ["不縮放尺寸", "Do not resize"],
          ["1920 px · 網頁大圖", "1920 px · Large web image"],
          ["2560 px · 高解析", "2560 px · High resolution"],
          ["3840 px · 4K", "3840 px · 4K"],
          ["重新編碼會自然移除 EXIF、GPS 與相機資訊。智慧模式若原檔已最小，則會直接保留原檔內容。", "Re-encoding naturally removes EXIF, GPS, and camera information. In smart mode, the original is kept if it is already smaller."],
          ["原始大小", "Original size"],
          ["壓縮後", "Compressed"],
          ["總共省下", "Total saved"],
          ["正在你的電腦上處理", "Processing on your computer"],
          ["套用設定重新壓縮", "Compress again with these settings"],
          ["開始壓縮", "Start compression"],

          ["下載 ZIP", "Download ZIP"],
          ["所有處理都發生在這個分頁。關閉分頁後，暫存圖片會由瀏覽器釋放。", "All processing happens in this tab. Temporary images are released by the browser when you close it."],
          ["本機壓縮圖片-", "Local-compressed-images-"],

          ["壓縮後", "after compression"]
        ];

        let language = "zh";
        try {
          language = window.localStorage.getItem("localshrink-language") || "zh";
        } catch {}
        let translating = false;

        const replaceLanguage = (value, toEnglish) => {
          let result = value;
          const orderedTranslations = [...translations].sort((a, b) => {
            const aLength = toEnglish ? a[0].length : a[1].length;
            const bLength = toEnglish ? b[0].length : b[1].length;
            return bLength - aLength;
          });
          for (const [zh, en] of orderedTranslations) {
            result = result.split(toEnglish ? zh : en).join(toEnglish ? en : zh);
          }
          return result;
        };

        const translatePage = () => {
          if (translating) return;
          translating = true;
          const toEnglish = language === "en";
          document.documentElement.lang = toEnglish ? "en" : "zh-Hant";
          document.documentElement.dataset.language = toEnglish ? "en" : "zh";
          window.dispatchEvent(new CustomEvent("localshrink-language-change", { detail: { language } }));
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest("script, style")) continue;
            const translated = replaceLanguage(node.nodeValue, toEnglish);
            if (translated !== node.nodeValue) node.nodeValue = translated;
          }
          document.querySelectorAll("[aria-label], [placeholder]").forEach((element) => {
            for (const attribute of ["aria-label", "placeholder"]) {
              if (element.hasAttribute(attribute)) {
                const current = element.getAttribute(attribute);
                const translated = replaceLanguage(current, toEnglish);
                if (translated !== current) element.setAttribute(attribute, translated);
              }
            }
          });
          const button = document.getElementById("language-toggle");
          if (button) {
            const nextText = toEnglish ? "中文" : "EN";
            const nextLabel = toEnglish ? "切換至中文" : "Switch to English";
            const label = button.querySelector(".language-label");
            if (label && label.textContent !== nextText) label.textContent = nextText;
            if (button.getAttribute("aria-label") !== nextLabel) button.setAttribute("aria-label", nextLabel);
          }
          translating = false;
        };

        const ensureLanguageButton = () => {
          const topbar = document.querySelector(".topbar");
          if (!topbar || document.getElementById("language-toggle")) return Boolean(topbar);
          const button = document.createElement("button");
          button.id = "language-toggle";
          button.className = "language-toggle";
          button.type = "button";
          button.innerHTML = '<svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.2 12h17.6M12 2.75c2.35 2.55 3.5 5.62 3.5 9.25S14.35 18.7 12 21.25c-2.35-2.55-3.5-5.62-3.5-9.25S9.65 5.3 12 2.75Z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="M4.7 7.5h14.6M4.7 16.5h14.6" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg><span class="language-label"></span>';
          button.addEventListener("click", () => {
            language = language === "en" ? "zh" : "en";
            try {
              window.localStorage.setItem("localshrink-language", language);
            } catch {}
            translatePage();
          });
          const privacyPill = topbar.querySelector(".privacy-pill");
          const actions = document.createElement("div");
          actions.className = "topbar-actions";
          if (privacyPill) {
            topbar.insertBefore(actions, privacyPill);
            actions.appendChild(privacyPill);
          } else {
            topbar.appendChild(actions);
          }
          actions.appendChild(button);
          return true;
        };

        const observer = new MutationObserver(() => {
          if (!translating && language === "en") translatePage();
        });
        let observerStarted = false;

        const boot = () => {
          if (!ensureLanguageButton()) {
            window.setTimeout(boot, 50);
            return;
          }
          translatePage();
          if (!observerStarted) {
            const root = document.getElementById("root");
            if (root) {
              observer.observe(root, { childList: true, subtree: true });
              observerStarted = true;
            }
          }
        };
        window.addEventListener("load", () => window.setTimeout(boot, 0), { once: true });
      })();

    <script>
      (() => {
        const modal = document.createElement("div");
        modal.className = "detail-modal";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.innerHTML = `
          <div class="detail-modal-head">
            <div>
              <span class="detail-modal-kicker" data-modal-kicker></span>
              <h2 class="detail-modal-title" data-modal-title></h2>
            </div>
            <div class="detail-modal-controls">
              <button type="button" data-zoom-out aria-label=""></button>
              <button type="button" class="detail-modal-reset" data-zoom-reset>100%</button>
              <button type="button" data-zoom-in aria-label=""></button>
              <button type="button" class="detail-modal-close" data-modal-close aria-label="">×</button>
            </div>
          </div>
          <p class="detail-modal-hint" data-modal-hint></p>
          <div class="detail-modal-body">
            <section class="detail-modal-pane">
              <div class="detail-modal-pane-head"><strong data-pane-title="original"></strong><span data-pane-meta="original"></span></div>
              <img data-pane-image="original" alt="" />
            </section>
            <section class="detail-modal-pane">
              <div class="detail-modal-pane-head"><strong data-pane-title="compressed"></strong><span data-pane-meta="compressed"></span></div>
              <img data-pane-image="compressed" alt="" />
            </section>
          </div>`;
        document.body.appendChild(modal);

        let scale = 1;
        let currentRecords = [];
        const copy = {
          zh: { kicker: "細節檢視", title: "放大比較", hint: "按住滑鼠拖曳移動，滾動滾輪縮放；可查看細節與壓縮損失", zoomOut: "縮小", zoomIn: "放大", close: "關閉", original: "原始", compressed: "壓縮後" },
          en: { kicker: "DETAIL VIEW", title: "Zoomed comparison", hint: "Drag with the mouse to pan and use the wheel to zoom; inspect detail and compression loss", zoomOut: "Zoom out", zoomIn: "Zoom in", close: "Close", original: "Original", compressed: "Compressed" }
        };

        const currentCopy = () => copy[document.documentElement.dataset.language === "en" ? "en" : "zh"];
        const setModalCopy = () => {
          const text = currentCopy();
          modal.querySelector("[data-modal-kicker]").textContent = text.kicker;
          modal.querySelector("[data-modal-title]").textContent = text.title;
          modal.querySelector("[data-modal-hint]").textContent = text.hint;
          modal.querySelector("[data-zoom-out]").textContent = "−";
          modal.querySelector("[data-zoom-out]").setAttribute("aria-label", text.zoomOut);
          modal.querySelector("[data-zoom-in]").textContent = "+";
          modal.querySelector("[data-zoom-in]").setAttribute("aria-label", text.zoomIn);
          modal.querySelector("[data-modal-close]").setAttribute("aria-label", text.close);
          modal.querySelector('[data-pane-title="original"]').textContent = text.original;
          modal.querySelector('[data-pane-title="compressed"]').textContent = text.compressed;
        };

        const panes = [...modal.querySelectorAll(".detail-modal-pane")];
        let syncingScroll = false;

        const syncPaneScroll = (sourcePane) => {
          if (syncingScroll) return;
          syncingScroll = true;
          const maxSourceLeft = Math.max(0, sourcePane.scrollWidth - sourcePane.clientWidth);
          const maxSourceTop = Math.max(0, sourcePane.scrollHeight - sourcePane.clientHeight);
          const leftRatio = maxSourceLeft ? sourcePane.scrollLeft / maxSourceLeft : 0;
          const topRatio = maxSourceTop ? sourcePane.scrollTop / maxSourceTop : 0;
          panes.forEach((pane) => {
            if (pane === sourcePane) return;
            pane.scrollLeft = leftRatio * Math.max(0, pane.scrollWidth - pane.clientWidth);
            pane.scrollTop = topRatio * Math.max(0, pane.scrollHeight - pane.clientHeight);
          });
          window.requestAnimationFrame(() => { syncingScroll = false; });
        };

        const setScale = (nextScale) => {
          scale = Math.max(.5, Math.min(4, nextScale));
          modal.querySelectorAll("[data-pane-image]").forEach((image) => {
            image.style.width = `${scale * 100}%`;
          });
          modal.querySelector("[data-zoom-reset]").textContent = `${Math.round(scale * 100)}%`;
        };

        const zoomAt = (pane, event, amount) => {
          const previousScale = scale;
          const nextScale = Math.max(.5, Math.min(4, scale + amount));
          if (nextScale === previousScale) return;
          const rect = pane.getBoundingClientRect();
          const pointerX = event.clientX - rect.left;
          const pointerY = event.clientY - rect.top;
          const contentX = pane.scrollLeft + pointerX;
          const contentY = pane.scrollTop + pointerY;
          setScale(nextScale);
          window.requestAnimationFrame(() => {
            const ratio = nextScale / previousScale;
            pane.scrollLeft = Math.max(0, contentX * ratio - pointerX);
            pane.scrollTop = Math.max(0, contentY * ratio - pointerY);
            syncPaneScroll(pane);
          });
        };

        panes.forEach((pane) => {
          let dragState = null;
          pane.addEventListener("wheel", (event) => {
            event.preventDefault();
            zoomAt(pane, event, event.deltaY < 0 ? .25 : -.25);
          }, { passive: false });
          pane.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            dragState = { x: event.clientX, y: event.clientY, left: pane.scrollLeft, top: pane.scrollTop };
            pane.classList.add("is-dragging");
            pane.setPointerCapture(event.pointerId);
          });
          pane.addEventListener("pointermove", (event) => {
            if (!dragState) return;
            pane.scrollLeft = dragState.left - (event.clientX - dragState.x);
            pane.scrollTop = dragState.top - (event.clientY - dragState.y);
            syncPaneScroll(pane);
          });
          const stopDragging = (event) => {
            if (!dragState) return;
            dragState = null;
            pane.classList.remove("is-dragging");
            if (event.pointerId !== undefined && pane.hasPointerCapture(event.pointerId)) pane.releasePointerCapture(event.pointerId);
          };
          pane.addEventListener("pointerup", stopDragging);
          pane.addEventListener("pointercancel", stopDragging);
          pane.addEventListener("scroll", () => syncPaneScroll(pane));
          pane.querySelector("img")?.addEventListener("dragstart", (event) => event.preventDefault());
        });

        const closeModal = () => {
          modal.classList.remove("is-open");
          document.body.classList.remove("detail-modal-open");
        };

        const openModal = (figure) => {
          const figures = [...figure.parentElement.querySelectorAll("figure")];
          currentRecords = figures.map((item, index) => {
            const caption = item.querySelector("figcaption");
            const captionLabel = caption?.querySelector("span")?.textContent.trim() || "";
            const fileSize = caption?.querySelector("strong")?.textContent.trim() || "";
            const dimensions = index === 1 ? captionLabel.split("·").slice(1).join("·").trim() : "";
            return {
              src: item.querySelector("img")?.src || "",
              alt: item.querySelector("img")?.alt || "",
              meta: [dimensions, fileSize].filter(Boolean).join(" · ")
            };
          });
          currentRecords.forEach((record, index) => {
            const side = index === 0 ? "original" : "compressed";
            const image = modal.querySelector(`[data-pane-image="${side}"]`);
            image.src = record.src;
            image.alt = record.alt;
            modal.querySelector(`[data-pane-meta="${side}"]`).textContent = record.meta;
          });
          scale = 1;
          setModalCopy();
          setScale(scale);
          modal.classList.add("is-open");
          document.body.classList.add("detail-modal-open");
        };

        const syncAfterZoomButton = (nextScale) => {
          setScale(nextScale);
          window.requestAnimationFrame(() => syncPaneScroll(panes[0]));
        };
        modal.querySelector("[data-zoom-out]").addEventListener("click", () => syncAfterZoomButton(scale - .25));
        modal.querySelector("[data-zoom-in]").addEventListener("click", () => syncAfterZoomButton(scale + .25));
        modal.querySelector("[data-zoom-reset]").addEventListener("click", () => syncAfterZoomButton(1));
        modal.querySelector("[data-modal-close]").addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeModal();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && modal.classList.contains("is-open")) closeModal();
        });
        document.addEventListener("click", (event) => {
          const figure = event.target.closest(".comparison .compare-grid figure");
          if (figure) openModal(figure);
        });
        window.addEventListener("localshrink-language-change", setModalCopy);
        setModalCopy();
      })();
    </script>

      @media (max-width: 600px) {
        .comparison .output-format-badge { right: 18px; bottom: 14px; font-size: 11px; }
        .file-copy .output-meta { font-size: 11px; }
      }
    </style>
    <script>
      (() => {
        const formatCopy = {
          zh: { label: "輸出格式", auto: "自動 · 依檔案而異", note: "智慧選擇可能依每個檔案選用不同格式" },
          en: { label: "Output format", auto: "Auto · varies by file", note: "Smart choice may use a different format for each file" }
        };

        const actualFormatsByName = new Map();
        let capturingCompressionResults = false;
        let capturedCompressionResults = [];
        let assignedCompressionResults = 0;
        const nativeCreateObjectURL = URL.createObjectURL.bind(URL);
        URL.createObjectURL = (value) => {
          const url = nativeCreateObjectURL(value);
          if (capturingCompressionResults && value instanceof Blob && value.type.startsWith("image/")) {
            capturedCompressionResults.push({
              format: value.type.replace("image/", "").toUpperCase(),
              size: value.size
            });
          }
          return url;
        };

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".primary-button")) return;
          actualFormatsByName.clear();
          capturedCompressionResults = [];
          assignedCompressionResults = 0;
          capturingCompressionResults = true;
        });

        const parseSize = (value) => {
          const match = value.match(/([\d.]+)\s*(B|KB|MB|GB)/i);
          if (!match) return 0;
          const units = { B: 1, KB: 1024, MB: 1024 * 1024, GB: 1024 * 1024 * 1024 };
          return Number(match[1]) * units[match[2].toUpperCase()];
        };

        const updateSizeDeltaStates = () => {
          document.querySelectorAll(".queue-item").forEach((item) => {
            const originalSize = parseSize(item.querySelector(".file-copy small")?.textContent || "");
            const outputSize = parseSize(item.querySelector(".item-size")?.textContent || "");
            const state = item.querySelector(".item-state");
            if (!originalSize || !outputSize || !state || outputSize <= originalSize) {
              state?.classList.remove("increased");
              return;
            }
            const increase = Math.max(1, Math.round((outputSize / originalSize - 1) * 100));
            const nextText = `+${increase}%`;
            if (state.textContent !== nextText) state.textContent = nextText;
            state.classList.add("increased");
          });
        };

        const updateActualFormats = () => {
          if (!capturingCompressionResults || !capturedCompressionResults.length) return;
          const completedRows = [...document.querySelectorAll(".queue-item")]
            .filter((item) => item.querySelector(".item-state.done"));
          while (assignedCompressionResults < capturedCompressionResults.length && assignedCompressionResults < completedRows.length) {
            const item = completedRows[assignedCompressionResults];
            const name = item.querySelector(".file-copy strong")?.textContent.trim();
            if (name) actualFormatsByName.set(name, capturedCompressionResults[assignedCompressionResults].format);
            assignedCompressionResults += 1;
          }
          const finishedRows = [...document.querySelectorAll(".queue-item")]
            .filter((item) => item.querySelector(".item-state.done, .item-state.error"));
          if (finishedRows.length === document.querySelectorAll(".queue-item").length && finishedRows.length) {
            capturingCompressionResults = false;
          }
        };

        const updateOutputFormat = () => {
          const language = document.documentElement.dataset.language === "en" ? "en" : "zh";
          const text = formatCopy[language];
          const selected = document.querySelector('input[name="format"]:checked');
          const value = selected?.value || "auto";
          const format = value === "auto" ? text.auto : value.replace("image/", "").toUpperCase();
          const rowFormat = value === "auto" ? "AUTO" : format;
          document.querySelectorAll(".comparison").forEach((comparison) => {
            const head = comparison.querySelector(".queue-head");
            if (!head) return;
            let badge = head.querySelector(".output-format-badge");
            if (!badge) {
              badge = document.createElement("span");
              badge.className = "output-format-badge";
              head.appendChild(badge);
            }
            const displayFormat = badge.dataset.actualFormat || format;
            const nextText = `${text.label} · ${displayFormat}`;
            if (badge.textContent !== nextText) badge.textContent = nextText;
            badge.title = badge.dataset.actualFormat ? `${text.label}: ${displayFormat}` : (value === "auto" ? text.note : `${text.label}: ${displayFormat}`);

            const resultImage = comparison.querySelector(".compare-grid figure:nth-child(2) img");
            const resultUrl = resultImage?.src || "";
            if (resultUrl && resultUrl !== badge.dataset.source) {
              const languageAtRequest = language;
              badge.dataset.actualFormat = "";
              badge.dataset.source = resultUrl;
              fetch(resultUrl).then((response) => response.blob()).then((blob) => {
                if (badge.dataset.source !== resultUrl || document.documentElement.dataset.language !== languageAtRequest || !blob.type) return;
                const actualFormat = blob.type.replace("image/", "").toUpperCase();
                badge.dataset.actualFormat = actualFormat;
                const actualText = `${text.label} · ${actualFormat}`;
                if (badge.textContent !== actualText) badge.textContent = actualText;
                badge.title = `${text.label}: ${actualFormat}`;
              }).catch(() => {});
            }
            if (badge.dataset.actualFormat) {
              const actualText = `${text.label} · ${badge.dataset.actualFormat}`;
              if (badge.textContent !== actualText) badge.textContent = actualText;
              badge.title = `${text.label}: ${badge.dataset.actualFormat}`;
            }

          });

          const activeItem = document.querySelector(".queue-item.active");
          const activeComparison = document.querySelector(".comparison");
          const activeBadge = activeComparison?.querySelector(".output-format-badge");
          const activeFormat = activeBadge?.dataset.actualFormat || format;
          document.querySelectorAll(".queue-item").forEach((item) => {
            const fileCopy = item.querySelector(".file-copy");
            const originalMeta = fileCopy?.querySelector("small:not(.output-meta)");
            const compressedSize = item.querySelector(".item-size")?.textContent.trim() || "";
            if (!fileCopy || !originalMeta || !compressedSize || compressedSize === "—") return;

            originalMeta.style.display = "none";
            let outputMeta = fileCopy.querySelector(".output-meta");
            if (!outputMeta) {
              outputMeta = document.createElement("small");
              outputMeta.className = "output-meta";
              fileCopy.appendChild(outputMeta);
            }
            const fileName = fileCopy.querySelector("strong")?.textContent.trim() || "";
            const displayFormat = actualFormatsByName.get(fileName)
              || (item === activeItem ? activeFormat : rowFormat);
            const originalText = `${language === "en" ? "Original" : "原始"} · ${originalMeta.textContent.trim()}`;
            const outputText = `${language === "en" ? "Output" : "輸出"} · ${compressedSize} · ${displayFormat}`;
            const combinedText = `${originalText}　　${outputText}`;
            if (outputMeta.textContent !== combinedText) outputMeta.textContent = combinedText;
          });
        };

        document.addEventListener("change", (event) => {
          if (event.target.matches('input[name="format"]')) updateOutputFormat();
        });
        window.addEventListener("localshrink-language-change", updateOutputFormat);
        window.addEventListener("load", () => window.setTimeout(updateOutputFormat, 0), { once: true });
        window.setInterval(() => {
          updateActualFormats();
          updateOutputFormat();
          updateSizeDeltaStates();
        }, 500);
      })();
    </script>
    <script>
      (() => {
        const privacyLines = [
          {
            zh: "你的檔案不出門，也不在這裡過夜",
            en: "Your files never leave your device, and never spend the night here."
          },
          {
            zh: "留在你的裝置，止於你的瀏覽器",
            en: "Stays on your device. Stops at your browser."
          }
        ];
        const selectedLine = privacyLines[Math.floor(Math.random() * privacyLines.length)];

        const updatePrivacyLine = () => {
          const pill = document.querySelector(".privacy-pill");
          if (!pill) return;
          const textNode = [...pill.childNodes].find((node) => node.nodeType === Node.TEXT_NODE);
          if (textNode) textNode.textContent = ` ${selectedLine[document.documentElement.dataset.language === "en" ? "en" : "zh"]}`;
        };

        window.addEventListener("localshrink-language-change", updatePrivacyLine);
        window.addEventListener("load", () => window.setTimeout(updatePrivacyLine, 0), { once: true });
      })();
    </script>
  </body>
</html>
